<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TITAN X - اختبار GitHub Pages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #080b14; color: #f4f1e8;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: min(100%, 560px); padding: 36px 28px; text-align: center;
      border: 1px solid #b99a52; border-radius: 18px;
      background: linear-gradient(145deg, #151b2b, #090d17);
      box-shadow: 0 18px 60px #0008;
    }
    h1 { margin: 0 0 12px; color: #d8bd79; letter-spacing: 2px; }
    p { line-height: 1.8; color: #c8cedb; }
    .status {
      display: inline-block; margin-top: 14px; padding: 10px 18px;
      border-radius: 999px; background: #123b30; color: #8ff0c4;
      border: 1px solid #267b60;
    }
    small { display: block; margin-top: 26px; color: #7f899d; }
  </style>
</head>
<body>
  <main>
    <h1>TITAN X</h1>
    <p>مرحباً بك في صفحة الاختبار.</p>
    <p>إذا ظهرت هذه الصفحة عبر رابط GitHub Pages، فهذا يعني أن نشر ملف HTML يعمل بنجاح.</p>
    <div class="status">✓ تم تحميل الصفحة بنجاح</div>
    <small>ROBOT HOUSE · SMART LIVING FUTURE</small>
  </main>
</body>
</html>
